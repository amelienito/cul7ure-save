<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maquette A · Le chemin de fer</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0E0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&display=swap">
<style>
/* A — le chemin de fer : en maquette de magazine, c'est le plan de toutes les pages.
   Ici, c'est l'accueil : le livre entier, page par page, qui change d'état à mesure qu'on relit et qu'on vote. */
:root{
  --bg:#0A0E0D; --ink:#EEF3F0; --soft:rgba(238,243,240,.78); --muted:rgba(238,243,240,.52); --faint:rgba(238,243,240,.26);
  --mint:#4CC7A1; --glow:#7CF7DD; --lime:#C6F35E; --amber:#FFC978; --line:rgba(255,255,255,.12);
  --serif:'Bodoni Moda',Didot,Georgia,serif; --sans:'Mona Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(80% 60% at 0% 0%,rgba(76,199,161,.16),transparent 60%),radial-gradient(60% 50% at 100% 100%,rgba(198,243,94,.08),transparent 60%),var(--bg)}
a{color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:22px 34px 110px}
.top{display:flex;align-items:baseline;gap:14px;margin-bottom:34px}
.mark{font-weight:850;font-size:20px;letter-spacing:-.02em}
.mark b{color:var(--glow);font-weight:850}
.top .s{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted);font-variation-settings:"opsz" 18}
.top .me{margin-left:auto;font-size:14px;color:var(--muted)}
.top .me b{color:var(--ink)}

.grid{display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:56px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr;gap:34px}}
.hero{position:sticky;top:24px}
@media (max-width:980px){.hero{position:static}}
.big{font-family:var(--serif);font-weight:500;font-size:clamp(110px,13vw,190px);line-height:.8;letter-spacing:-.04em;font-variation-settings:"opsz" 96;margin:0}
.big small{display:block;font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:-.01em;margin-top:14px;color:var(--soft)}
.say{margin:26px 0 0;font-size:19px;line-height:1.5;color:var(--soft);max-width:34ch}
.say b{color:var(--ink);font-weight:700}
.say em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--ink);font-variation-settings:"opsz" 24}
.next{display:block;margin-top:28px;padding:18px 20px 20px;border-radius:20px;background:rgba(124,247,221,.08);border:1px solid rgba(124,247,221,.4);text-decoration:none;transition:background .2s}
.next:hover{background:rgba(124,247,221,.14)}
.next .k{font-size:13px;font-weight:650;color:var(--glow)}
.next .t{display:block;margin:6px 0 4px;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.05;letter-spacing:-.015em;font-variation-settings:"opsz" 28}
.next .m{font-size:13.5px;color:var(--muted)}
.next .go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;height:42px;padding:0 18px;border-radius:999px;background:var(--glow);color:#03231B;font-weight:750;font-size:14.5px}
.legend{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;font-size:14px;color:var(--soft);cursor:pointer;border-radius:8px}
.legend li b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.legend li.off{opacity:.35}
.legend i{width:11px;height:15px;border-radius:2px;display:block}
.only{margin-top:18px;display:inline-flex;gap:3px;padding:3px;border-radius:999px;border:1px solid var(--line)}
.only button{height:32px;padding:0 13px;border-radius:999px;border:0;background:none;color:var(--soft);font:600 13.5px var(--sans);cursor:pointer}
.only button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.links{margin-top:22px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.links a{color:var(--soft);text-underline-offset:4px;text-decoration-color:rgba(124,247,221,.5)}

/* le plan */
.plan h2{margin:0 0 4px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;color:var(--muted);font-variation-settings:"opsz" 22}
.plan .hint{margin:0 0 22px;font-size:13.5px;color:var(--muted)}
.yr{display:grid;grid-template-columns:74px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.yr h3{margin:0;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1;font-variation-settings:"opsz" 36}
.yr h3 small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);margin-top:6px}
.pages{display:flex;flex-wrap:wrap;gap:3px 6px;align-content:flex-start}
.art{display:inline-flex;gap:2px;padding:2px;border-radius:4px;cursor:pointer;transition:opacity .25s,background .15s;text-decoration:none}
.art:hover,.art:focus-visible{background:rgba(255,255,255,.12);outline:none}
.pg{width:10px;height:14px;border-radius:1.5px;background:color-mix(in srgb,var(--c,#888) 30%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#888) 70%,transparent)}
.art[data-e="cours"] .pg{background:linear-gradient(180deg,transparent 50%,rgba(124,247,221,.7) 50%);box-shadow:inset 0 0 0 1px rgba(124,247,221,.7)}
.art[data-e="relu"] .pg{background:rgba(238,243,240,.82);box-shadow:none}
.art[data-e="retenu"] .pg{background:linear-gradient(160deg,#E9FFF8,#7CF7DD 55%,#4CC7A1);box-shadow:0 0 6px rgba(124,247,221,.6)}
.art[data-e="ecarte"] .pg{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.art.discuter .pg{box-shadow:inset 0 0 0 1px var(--amber)}
.art .pg:first-child{border-top-left-radius:3px}
.art.pro{animation:pro 1.6s ease-in-out infinite}
@keyframes pro{50%{background:rgba(124,247,221,.28)}}
body.mine .art:not(.m){opacity:.16}
body.f-arelire .art[data-e="arelire"],body.f-cours .art[data-e="cours"],body.f-relu .art[data-e="relu"],body.f-retenu .art[data-e="retenu"],body.f-ecarte .art[data-e="ecarte"]{opacity:.1}
@media (max-width:640px){.wrap{padding:16px 16px 110px}.yr{grid-template-columns:1fr;gap:8px}.pg{width:8px;height:11px}.big{font-size:120px}}
.mq-tip{position:fixed;z-index:900;pointer-events:none;max-width:300px;padding:12px 14px;border-radius:14px;background:rgba(8,12,11,.96);border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:13px;color:var(--soft);opacity:0;transition:opacity .12s}
.mq-tip.on{opacity:1}
.mq-tip b{display:block;font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.1;color:var(--ink);margin:4px 0 6px;font-variation-settings:"opsz" 20}
.mq-tip .r{display:flex;align-items:center;gap:7px}
.mq-tip .r i{width:8px;height:8px;border-radius:50%}
.load{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.art.pro{animation:none;background:rgba(124,247,221,.28)}}
@media (max-width:640px){.top{flex-wrap:wrap;gap:4px 10px}.top .s,.top>span:nth-child(2){white-space:nowrap}.top .me{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="mark">Cul<b>7</b>ure</span><span class="s">les archives</span><span class="me" id="me"></span></header>
  <div class="grid">
    <section class="hero" id="hero"><p class="load">Chargement du livre…</p></section>
    <section class="plan" id="plan"></section>
  </div>
</div>
<script src="../config.js"></script>
<script src="../data/articles.js"></script>
<script src="commun.js"></script>
<script>
(function () {
  var E = MQ.esc;
  MQ.barre("a");
  MQ.charger().then(function (D) {
    document.getElementById("me").innerHTML = "Connecté en tant que <b>" + E(D.qui) + "</b>" + (D.live ? "" : " · instantané");
    var p = D.prochain, cnt = { arelire: 0, cours: 0, relu: 0, retenu: 0, ecarte: 0 };
    D.arts.forEach(function (a) { cnt[a.etat] += a.pages; });
    var reste = D.mes.length - D.mesRelus;
    var h = '<h1 class="big">' + MQ.nf.format(D.pages) + '<small>pages, si vous gardez tout.</small></h1>';
    h += '<p class="say">' + E(D.qui) + ', tu as relu <b>' + D.mesRelus + '</b> de tes <b>' + D.mes.length + '</b> articles. ' +
      (p ? 'Le prochain commence <em>page ' + p.p0 + '</em>.' : 'Tout est relu de ton côté.') + '</p>';
    if (p) h += '<a class="next" href="' + MQ.lien(p.id) + '"><span class="k">' + (p.statut === "cours" ? "À reprendre" : "Ton prochain article") + '</span>' +
      '<span class="t">' + E(p.titre) + '</span><span class="m">' + E(p.rub) + ' · ' + MQ.moisAn(p.date) + ' · p. ' + p.p0 + '–' + (p.p0 + p.pages - 1) + '</span><br>' +
      '<span class="go">' + (p.statut === "cours" ? "Reprendre la relecture" : "Commencer la relecture") + '</span></a>';
    var leg = [["arelire", "À relire (couleur de la rubrique)", "background:linear-gradient(90deg,rgba(144,133,233,.35),rgba(47,184,132,.35),rgba(232,116,59,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)"], ["cours", "En cours", "background:linear-gradient(180deg,transparent 50%,rgba(124,247,221,.7) 50%);box-shadow:inset 0 0 0 1px rgba(124,247,221,.7)"], ["relu", "Relu", "background:rgba(238,243,240,.82)"], ["retenu", "Retenu (oui + oui)", "background:linear-gradient(160deg,#E9FFF8,#7CF7DD 55%,#4CC7A1)"], ["ecarte", "Écarté (non + non)", "background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)"]];
    h += '<ul class="legend" id="leg">' + leg.map(function (l) { return '<li data-f="' + l[0] + '" title="Masquer / afficher"><i style="' + l[2] + '"></i><span>' + l[1] + '</span><b>' + MQ.plur(cnt[l[0]], "page") + '</b></li>'; }).join("") + '</ul>';
    h += '<div class="only" role="group" aria-label="Quels articles"><button type="button" data-v="tous" aria-pressed="true">Tout le livre</button><button type="button" data-v="moi" aria-pressed="false">Mes articles</button></div>';
    h += '<div class="links"><a href="../#/livre">Voter (' + D.sansVote + ' sans ton vote)</a><a href="../#/articles">La liste complète</a></div>';
    document.getElementById("hero").innerHTML = h;
    // le plan, année par année
    var parAn = {};
    D.arts.forEach(function (a) { (parAn[a.annee || "?"] = parAn[a.annee || "?"] || []).push(a); });
    var ph = '<h2>Le chemin de fer</h2><p class="hint">Chaque petit rectangle est une page du livre, dans l’ordre de parution. Survole un article pour le voir, clique pour l’ouvrir.</p>';
    Object.keys(parAn).sort().forEach(function (y) {
      var L = parAn[y], pg = L.reduce(function (t, a) { return t + a.pages; }, 0);
      ph += '<div class="yr"><h3>' + E(y) + '<small>' + L.length + ' articles · ' + pg + ' p.</small></h3><div class="pages">';
      L.forEach(function (a) {
        var cls = "art" + (a.mien ? " m" : "") + (a.livre === "discuter" ? " discuter" : "") + (p && a.id === p.id ? " pro" : "");
        ph += '<a class="' + cls + '" href="' + MQ.lien(a.id) + '" data-id="' + E(a.id) + '" data-e="' + a.etat + '" style="--c:' + a.couleur + '">' + new Array(a.pages + 1).join('<i class="pg"></i>') + '</a>';
      });
      ph += '</div></div>';
    });
    var plan = document.getElementById("plan");
    plan.innerHTML = ph;
    var par = {};
    D.arts.forEach(function (a) { par[a.id] = a; });
    plan.addEventListener("mousemove", function (e) {
      var el = e.target.closest(".art");
      if (!el) { MQ.bulle(0, 0, null); return; }
      var a = par[el.dataset.id];
      MQ.bulle(e.clientX, e.clientY, '<span class="r"><i style="background:' + a.couleur + '"></i>' + E(a.rub) + ' · ' + MQ.moisAn(a.date) + '</span><b>' + E(a.titre) + '</b>' +
        (a.p0 ? 'p. ' + a.p0 + (a.pages > 1 ? '–' + (a.p0 + a.pages - 1) : '') + ' · ' : '') + MQ.ETATS[a.etat] + (a.rel ? ' · relecture : ' + (a.mien ? 'toi' : a.rel) : ''));
    });
    plan.addEventListener("mouseleave", function () { MQ.bulle(0, 0, null); });
    document.querySelectorAll(".only button").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".only button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        document.body.classList.toggle("mine", b.dataset.v === "moi");
      });
    });
    document.getElementById("leg").addEventListener("click", function (e) {
      var li = e.target.closest("li");
      if (!li) return;
      li.classList.toggle("off");
      document.body.classList.toggle("f-" + li.dataset.f);
    });
  });
})();
</script>
</body>
</html>
