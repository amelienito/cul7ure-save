<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maquette C · La frise</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&display=swap">
<style>
/* C — la frise : sept ans de Cul7ure d'un seul regard. Chaque rond est un article, posé à sa date, dans sa rubrique,
   grand comme son nombre de mots. Il se remplit quand il est relu, il brille quand il est retenu. */
:root{
  --bg:#07090B; --ink:#EEF1F4; --soft:rgba(238,241,244,.8); --muted:rgba(238,241,244,.52); --faint:rgba(238,241,244,.2);
  --line:rgba(255,255,255,.1); --glow:#7CF7DD; --mint:#4CC7A1;
  --serif:'Bodoni Moda',Didot,Georgia,serif; --sans:'Mona Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(60% 40% at 50% 0%,rgba(76,199,161,.12),transparent 70%),var(--bg)}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:22px 34px 120px}
.top{display:flex;align-items:baseline;gap:14px;margin-bottom:40px;font-size:14px;color:var(--muted)}
.top .mark{font-weight:800;font-stretch:125%;font-size:17px;color:var(--ink);letter-spacing:-.01em}
.top .me{margin-left:auto}
.top .me b{color:var(--ink)}
h1{margin:0;font-weight:800;font-stretch:125%;font-size:clamp(40px,5.6vw,84px);line-height:.95;letter-spacing:-.04em;max-width:15ch}
h1 em{font-family:var(--serif);font-style:italic;font-weight:500;font-stretch:100%;letter-spacing:-.01em;color:var(--glow);font-variation-settings:"opsz" 72}
.kpis{display:flex;gap:clamp(20px,4vw,56px);flex-wrap:wrap;margin:30px 0 8px}
.kpi b{display:block;font-weight:750;font-stretch:125%;font-size:clamp(30px,3vw,44px);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.kpi span{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)}
.kpi.me b{color:var(--glow)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:30px 0 8px}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg button{height:32px;padding:0 13px;border-radius:999px;border:0;background:none;color:var(--soft);font:600 13.5px var(--sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--soft)}
.key span{display:inline-flex;align-items:center;gap:7px}
.key svg{width:14px;height:14px}
.frise{position:relative;margin:0 -10px;overflow-x:auto;scrollbar-width:thin}
.frise svg{display:block;min-width:980px;width:100%;height:auto}
.lane-l{font:600 12.5px var(--sans);fill:var(--muted)}
.yr-l{font-family:var(--serif);font-weight:500;font-size:22px;fill:var(--ink);font-variation-settings:"opsz" 24}
.yr-g{stroke:var(--line);stroke-width:1}
.lane-g{stroke:rgba(255,255,255,.05);stroke-width:1}
.dot{cursor:pointer;transition:opacity .3s,transform .7s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.dot.pre{opacity:0;transform:translateY(-60px)}
.dot:hover{stroke:#fff;stroke-width:2}
body.mine .dot:not(.m){opacity:.13}
.pulse{fill:none;stroke:var(--glow);stroke-width:2;animation:pl 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.callout{font:700 13px var(--sans);fill:var(--glow)}
.under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;margin-top:26px;align-items:start}
@media (max-width:900px){.under{grid-template-columns:1fr}}
.next{display:block;padding:22px 24px;border-radius:22px;border:1px solid rgba(124,247,221,.35);background:linear-gradient(135deg,rgba(76,199,161,.14),rgba(76,199,161,.02));text-decoration:none}
.next .k{font-size:13px;font-weight:650;color:var(--glow)}
.next .t{display:block;margin:8px 0 6px;font-family:var(--serif);font-weight:500;font-size:clamp(28px,2.8vw,40px);line-height:1.02;letter-spacing:-.015em;font-variation-settings:"opsz" 40}
.next .m{font-size:14px;color:var(--muted)}
.next .go{display:inline-flex;align-items:center;margin-top:16px;height:44px;padding:0 20px;border-radius:999px;background:var(--glow);color:#03231B;font-weight:750;font-size:14.5px}
.years h2{margin:0 0 12px;font-size:15px;font-weight:700}
.yrow{display:grid;grid-template-columns:48px 1fr 92px;gap:12px;align-items:center;font-size:13.5px;padding:5px 0}
.yrow .y{font-weight:700;font-variant-numeric:tabular-nums}
.yrow .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.yrow .bar i{display:block;height:100%}
.yrow .v{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mq-tip{position:fixed;z-index:900;pointer-events:none;max-width:300px;padding:12px 14px;border-radius:14px;background:rgba(9,11,14,.96);border:1px solid rgba(255,255,255,.2);font-size:13px;color:var(--soft);opacity:0;transition:opacity .12s;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.mq-tip.on{opacity:1}
.mq-tip b{display:block;font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.1;color:var(--ink);margin:4px 0 6px;font-variation-settings:"opsz" 20}
.mq-tip .r{display:flex;align-items:center;gap:7px}.mq-tip .r i{width:8px;height:8px;border-radius:50%}
@media (max-width:640px){.wrap{padding:16px 16px 110px}}
@media (prefers-reduced-motion:reduce){.dot{transition:none}.dot.pre{opacity:1;transform:none}.pulse{animation:none}}
@media (max-width:640px){.top{flex-wrap:wrap;gap:4px 10px}.top .s,.top>span:nth-child(2){white-space:nowrap}.top .me{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="mark">Cul7ure</span><span>les archives</span><span class="me" id="me"></span></header>
  <h1 id="h1">Sept ans de Cul7ure, d’un seul regard.</h1>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Quels articles"><button type="button" data-v="tous" aria-pressed="true">Tous les articles</button><button type="button" data-v="moi" aria-pressed="false">Ma liste</button></div>
    <div class="key">
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#bbb" stroke-width="1.6"/></svg>À relire</span>
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="#bbb" fill-opacity=".45" stroke="#bbb" stroke-width="1.6"/></svg>En cours</span>
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#bbb"/></svg>Relu</span>
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.5" fill="#bbb"/><circle cx="7" cy="7" r="6.3" fill="none" stroke="#7CF7DD" stroke-width="1.3"/></svg>Retenu</span>
      <span>Taille : nombre de mots</span>
    </div>
  </div>
  <div class="frise" id="frise"></div>
  <div class="under" id="under"></div>
</div>
<script src="../config.js"></script>
<script src="../data/articles.js"></script>
<script src="commun.js"></script>
<script>
(function () {
  var E = MQ.esc, NS = "http://www.w3.org/2000/svg";
  MQ.barre("c");
  function S(tag, at) { var el = document.createElementNS(NS, tag); for (var k in at) el.setAttribute(k, at[k]); return el; }
  MQ.charger().then(function (D) {
    document.getElementById("me").innerHTML = "Connecté en tant que <b>" + E(D.qui) + "</b>" + (D.live ? "" : " · instantané");
    var reste = D.mes.length - D.mesRelus;
    document.getElementById("h1").innerHTML = "Sept ans, " + D.arts.length + " articles, <em>un livre</em>.";
    document.getElementById("kpis").innerHTML =
      '<div class="kpi me"><b>' + reste + '</b><span>à relire pour toi</span></div>' +
      '<div class="kpi"><b>' + D.relus.length + '</b><span>relus en tout</span></div>' +
      '<div class="kpi"><b>' + D.sansVote + '</b><span>sans ton vote</span></div>' +
      '<div class="kpi"><b>' + D.retenus.length + '</b><span>retenus pour le livre</span></div>' +
      '<div class="kpi"><b>≈ ' + MQ.nf.format(D.pages) + '</b><span>pages si on garde tout</span></div>';
    // la frise
    var rubs = ["Chroniques", "Dossiers", "Interviews", "Parenthèses", "Portraits"];
    var W = 1240, L = 110, R = 24, laneH = 118, top = 26, H = top + rubs.length * laneH + 40;
    var t0 = new Date("2017-01-01").getTime(), t1 = new Date("2024-01-01").getTime();
    function X(d) { return L + (new Date(d).getTime() - t0) / (t1 - t0) * (W - L - R); }
    var svg = S("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Tous les articles de Cul7ure, de 2016 à 2023" });
    for (var y = 2017; y <= 2023; y++) {
      var xx = X(y + "-01-01");
      if (xx >= L) svg.appendChild(S("line", { x1: xx, x2: xx, y1: top - 10, y2: H - 30, class: "yr-g" }));
      var lab = S("text", { x: Math.max(L, xx) + 6, y: H - 8, class: "yr-l" }); lab.textContent = y; svg.appendChild(lab);
    }
    rubs.forEach(function (r, i) {
      var cy = top + i * laneH + laneH / 2;
      svg.appendChild(S("line", { x1: L, x2: W - R, y1: cy, y2: cy, class: "lane-g" }));
      var t = S("text", { x: 0, y: cy + 4, class: "lane-l" }); t.textContent = r; svg.appendChild(t);
    });
    // essaim : chaque rond se pose à sa date, au plus près de la ligne de sa rubrique, sans chevaucher les autres
    var placed = {}, dots = [];
    D.arts.forEach(function (a) {
      if (!a.date) return;
      var lane = rubs.indexOf(a.rub); if (lane < 0) lane = 0;
      var x0 = X(a.date), r = 2.6 + Math.sqrt(a.mots || 300) / 10.5, base = top + lane * laneH + laneH / 2;
      var P = placed[lane] || (placed[lane] = []), lim = laneH / 2 - r - 3, cx = x0, cy = base, ok = false;
      function hits(xx, yy) { return P.some(function (q) { var dx = q.x - xx, dy = q.y - yy; return dx * dx + dy * dy < (q.r + r + 1.4) * (q.r + r + 1.4); }); }
      // d'abord au-dessus et en dessous de la ligne, puis en décalant un peu dans le temps si la rubrique déborde
      for (var j = 0; j < 40 && !ok; j++) {
        var dx = (j % 2 ? 1 : -1) * Math.ceil(j / 2) * r * 1.6;
        for (var k = 0; k < 60; k++) {
          var dy = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 3.5;
          if (Math.abs(dy) > lim) break;
          if (!hits(x0 + dx, base + dy)) { cx = x0 + dx; cy = base + dy; ok = true; break; }
        }
      }
      P.push({ x: cx, y: cy, r: r });
      dots.push({ a: a, x: cx, y: cy, r: r });
    });
    dots.forEach(function (d, i) {
      var a = d.a, col = a.couleur, at = { cx: d.x, cy: d.y, r: d.r, class: "dot pre" + (a.mien ? " m" : ""), "data-id": a.id, tabindex: 0 };
      if (a.etat === "arelire") { at.fill = "rgba(0,0,0,0)"; at.stroke = col; at["stroke-width"] = 1.6; }
      else if (a.etat === "cours") { at.fill = col; at["fill-opacity"] = .45; at.stroke = col; at["stroke-width"] = 1.6; }
      else if (a.etat === "ecarte") { at.fill = col; at["fill-opacity"] = .12; }
      else at.fill = col;
      var c = S("circle", at);
      c.style.transitionDelay = (i * 4) + "ms";
      svg.appendChild(c);
      if (a.etat === "retenu") svg.appendChild(S("circle", { cx: d.x, cy: d.y, r: d.r + 2.5, fill: "none", stroke: "#7CF7DD", "stroke-width": 1.3, "pointer-events": "none" }));
    });
    var p = D.prochain, pd = p && dots.filter(function (d) { return d.a.id === p.id; })[0];
    if (pd) {
      svg.appendChild(S("circle", { cx: pd.x, cy: pd.y, r: pd.r + 2, class: "pulse", "pointer-events": "none" }));
      var ty = pd.y - pd.r - 14 < 14 ? pd.y + pd.r + 20 : pd.y - pd.r - 10;
      var t = S("text", { x: pd.x, y: ty, "text-anchor": pd.x > W - 160 ? "end" : "start", class: "callout" }); t.textContent = "ton prochain"; svg.appendChild(t);
    }
    var fr = document.getElementById("frise");
    fr.appendChild(svg);
    requestAnimationFrame(function () { requestAnimationFrame(function () { svg.querySelectorAll(".dot.pre").forEach(function (c) { c.classList.remove("pre"); }); }); });
    if (pd && fr.scrollWidth > fr.clientWidth) fr.scrollLeft = Math.max(0, pd.x / W * fr.scrollWidth - fr.clientWidth / 2);
    var par = {};
    D.arts.forEach(function (a) { par[a.id] = a; });
    svg.addEventListener("mousemove", function (e) {
      var el = e.target.closest(".dot");
      if (!el) { MQ.bulle(0, 0, null); return; }
      var a = par[el.dataset.id];
      MQ.bulle(e.clientX, e.clientY, '<span class="r"><i style="background:' + a.couleur + '"></i>' + E(a.rub) + ' · ' + MQ.moisAn(a.date) + '</span><b>' + E(a.titre) + '</b>' + MQ.nf.format(a.mots || 0) + ' mots · ' + MQ.ETATS[a.etat] + (a.rel ? ' · relecture : ' + (a.mien ? 'toi' : a.rel) : ''));
    });
    svg.addEventListener("mouseleave", function () { MQ.bulle(0, 0, null); });
    svg.addEventListener("click", function (e) { var el = e.target.closest(".dot"); if (el) location.href = MQ.lien(el.dataset.id); });
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        document.body.classList.toggle("mine", b.dataset.v === "moi");
      });
    });
    // sous la frise : le prochain article, et les années
    var u = "";
    if (p) u += '<a class="next" href="' + MQ.lien(p.id) + '"><span class="k">' + (p.statut === "cours" ? "À reprendre" : "Ton prochain article") + '</span><span class="t">' + E(p.titre) + '</span><span class="m">' + E(p.rub) + ' · ' + MQ.moisAn(p.date) + ' · ' + MQ.nf.format(p.mots || 0) + ' mots</span><br><span class="go">' + (p.statut === "cours" ? "Reprendre la relecture" : "Commencer la relecture") + '</span></a>';
    else u += '<div class="next"><span class="k">Bravo</span><span class="t">Tout est relu de ton côté.</span></div>';
    var parAn = {};
    D.arts.forEach(function (a) { var y = a.annee || "?"; (parAn[y] = parAn[y] || { n: 0, relu: 0, ret: 0 }).n++; if (a.statut === "relu") parAn[y].relu++; if (a.livre === "dedans") parAn[y].ret++; });
    var max = Math.max.apply(null, Object.keys(parAn).map(function (k) { return parAn[k].n; }));
    u += '<div class="years"><h2>Année par année</h2>' + Object.keys(parAn).sort().map(function (y) {
      var v = parAn[y];
      return '<div class="yrow"><span class="y">' + E(y) + '</span><span class="bar" style="width:' + (v.n / max * 100) + '%"><i style="width:' + (v.relu / v.n * 100) + '%;background:#EEF1F4"></i></span><span class="v">' + v.relu + ' / ' + v.n + ' relus</span></div>';
    }).join("") + '</div>';
    document.getElementById("under").innerHTML = u;
  });
})();
</script>
</body>
</html>
